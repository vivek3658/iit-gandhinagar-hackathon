user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # --------------------------------------------------------------------------
    # 1. In-Memory Edge Micro-Cache (Absorbs up to 85% of reads to reach 1M reads/s)
    # --------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge_microcache:100m inactive=60s max_size=1g use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # Rate Limiting Zones (Edge tier)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # --------------------------------------------------------------------------
    # 2. Upstream to Docker Compose App Cluster (Supports 4 to 6 Replicas)
    # --------------------------------------------------------------------------
    # Docker embedded DNS resolves 'app' round-robin across all 4-6 running containers
    upstream fastify_docker_cluster {
        least_conn;
        keepalive 128;
        server app:3000 max_fails=3 fail_timeout=5s;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        application/json
        application/javascript
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Health Check (Edge cached for 1s: absorbs up to 500k req/s at wire speed)
        location = /health {
            proxy_cache edge_microcache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://fastify_docker_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://fastify_docker_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Auth Rate Limiting (Sensitive endpoints)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://fastify_docker_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Edge Micro-Cached High-Volume Read Endpoints (Leaderboards, Activity Feed, Public State)
        location ~* ^/api/v1/(activity|leaderboard) {
            limit_req zone=api_limit burst=500 nodelay;
            proxy_cache edge_microcache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://fastify_docker_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API Gateway (100k writes/s write-behind buffer)
        location /api/ {
            limit_req zone=api_limit burst=500 nodelay;
            limit_req_status 429;

            proxy_pass http://fastify_docker_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
