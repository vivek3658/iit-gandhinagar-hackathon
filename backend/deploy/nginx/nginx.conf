# ==============================================================================
# UrjaVatika Production NGINX Reverse Proxy & Load Balancer Configuration
# Problem Statement: HC26-GEDA01 (Mission LiFE Citizen Engagement Platform)
# Architecture: High-concurrency edge gateway protecting 4 to 6 Fastify v5 instances
# Target Capacity: 100,000 Writes/sec | 1,000,000 Reads/sec (Edge Micro-Cache)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging with upstream response times
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"cache_status":"$upstream_cache_status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/urjavatika_access.log json_analytics;
    error_log /var/log/nginx/urjavatika_error.log warn;

    # --------------------------------------------------------------------------
    # 1. Edge In-Memory Micro-Cache Tier (Absorbs up to 85% of 1M Reads/sec)
    # --------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge_microcache:100m inactive=60s max_size=1g use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # --------------------------------------------------------------------------
    # 2. Edge Rate Limiting Zones
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:20m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --------------------------------------------------------------------------
    # 3. Fastify Upstream Cluster (Scalable from 4 to 6 Instances)
    # --------------------------------------------------------------------------
    upstream fastify_backend_cluster {
        least_conn;
        keepalive 128;

        # Core 4 Instances (Production baseline)
        server 127.0.0.1:3000 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=5s;

        # Scale-Out Instances 5 & 6 (Peak Load / 100k Writes & 1M Reads)
        server 127.0.0.1:3004 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:3005 max_fails=3 fail_timeout=5s;
    }

    # --------------------------------------------------------------------------
    # 4. Gzip & Compression Offload
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 5. HTTP Server Block (Redirect to HTTPS)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.urjavatika.gujarat.gov.in localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 6. HTTPS Secure Gateway Server Block
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.urjavatika.gujarat.gov.in localhost;

        ssl_certificate /etc/nginx/ssl/live/urjavatika/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/urjavatika/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_conn conn_limit 50;

        # Root Health Check (Micro-cached for 1s: absorbs up to 500k req/s at wire speed)
        location = /health {
            proxy_cache edge_microcache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://fastify_backend_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Endpoints (15 req/s per IP, burst 30)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://fastify_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Edge Micro-Cached High-Volume Read Endpoints (Leaderboards, Activity Feeds, State)
        location ~* ^/api/v1/(activity|leaderboard) {
            limit_req zone=api_gateway_limit burst=500 nodelay;
            proxy_cache edge_microcache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://fastify_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Gateway (100k writes/sec buffer)
        location /api/ {
            limit_req zone=api_gateway_limit burst=500 nodelay;
            limit_req_status 429;

            proxy_pass http://fastify_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # WebSocket / Server-Sent Events (SSE) for Real-Time Peak Alerts
        location /ws/ {
            proxy_pass http://fastify_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
