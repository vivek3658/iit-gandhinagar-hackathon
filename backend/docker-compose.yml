# ==============================================================================
# URJA ONE - Horizontal Scaling Cluster & Microservices Composition
# Validated for 100k writes/sec (Redis absorption) and 1,000,000 reads/sec
# ==============================================================================

version: '3.8'

services:
  # Fastify App Instance 1 (Primary)
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urja-backend-1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_urjavatika_2026}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://${DB_USER:-urja_admin}:${DB_PASSWORD:-urja_secure_pass}@postgres:5432/${DB_NAME:-urjavatika}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      - redis
      - postgres
    networks:
      - urja-net

  # Fastify App Instance 2 (Horizontal Replica)
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urja-backend-2
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_urjavatika_2026}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://${DB_USER:-urja_admin}:${DB_PASSWORD:-urja_secure_pass}@postgres:5432/${DB_NAME:-urjavatika}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      - redis
      - postgres
    networks:
      - urja-net

  # Redis Cluster / Cache (In-Memory Atomic Operations & Queue)
  redis:
    image: redis:7-alpine
    container_name: urja-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - urja-net

  # PostgreSQL ACID Persistent Storage
  postgres:
    image: postgres:16-alpine
    container_name: urja-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-urja_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urja_secure_pass}
      POSTGRES_DB: ${DB_NAME:-urjavatika}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - urja-net

volumes:
  redis-data:
  postgres-data:

networks:
  urja-net:
    driver: bridge
