# ==============================================================================
# UrjaVatika Production NGINX Reverse Proxy & Load Balancer Configuration
# Problem Statement: HC26-GEDA01 (Mission LiFE Citizen Engagement Platform)
# Architecture: High-concurrency edge gateway protecting Fastify v5 instances
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging with upstream response times
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/urjavatika_access.log json_analytics;
    error_log /var/log/nginx/urjavatika_error.log warn;

    # --------------------------------------------------------------------------
    # 1. Edge Rate Limiting Zones (Deflecting DDoS & 50k req/s traffic spikes)
    # --------------------------------------------------------------------------
    # Zone 1: General API rate limiting (100 req/sec per IP, burst up to 200)
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:20m rate=100r/s;

    # Zone 2: Stricter rate limiting for Auth & Sensitive endpoints (10 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # Connection limit per IP to prevent slowloris attacks
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --------------------------------------------------------------------------
    # 2. Fastify Upstream Cluster (Load Balancing)
    # --------------------------------------------------------------------------
    upstream fastify_backend_cluster {
        # least_conn routes new requests to worker with fewest active connections
        least_conn;

        # Keepalive connections pooled between NGINX and Fastify Node.js processes
        keepalive 64;

        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
    }

    # --------------------------------------------------------------------------
    # 3. Gzip & Compression Offload
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 4. HTTP Server Block (Redirect to HTTPS)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.urjavatika.gujarat.gov.in localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 5. HTTPS Secure Gateway Server Block
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.urjavatika.gujarat.gov.in localhost;

        # SSL Certificates (paths can be updated for local self-signed or Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/live/urjavatika/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/urjavatika/privkey.pem;

        # SSL Hardening (TLS 1.2 and 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Connection Limit
        limit_conn conn_limit 30;

        # Root Health Check (Bypasses rate limiting for monitoring agents & ALB)
        location = /health {
            proxy_pass http://fastify_backend_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Endpoints (Stricter Rate Limit: 10 req/s, burst 20)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://fastify_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Gateway (100 req/s, burst 200)
        location /api/ {
            limit_req zone=api_gateway_limit burst=200 nodelay;
            limit_req_status 429;

            proxy_pass http://fastify_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # WebSocket / Server-Sent Events (SSE) for Real-Time Peak Alerts & Multiplayer
        location /ws/ {
            proxy_pass http://fastify_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
